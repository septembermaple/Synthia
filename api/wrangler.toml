name = "synthia-api"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "synthia-db"
database_id = "551bbb9a-c286-4c9a-b822-3f45fc86a372"

[vars]
ENVIRONMENT = "production"
# 注意：ALLOWED_ORIGINS / ADMIN_PHONES / JWT_SECRET / DOUBAO_API_KEY / ARK_API_KEY / ADMIN_SECRET
# 通过 `npx wrangler secret put <NAME>` 配置，不要在这里再声明同名 vars，否则会覆盖 secret。

[observability]
enabled = true

# 每小时清理一次过期 generations 与陈旧限流记录
[triggers]
crons = ["0 * * * *"]
