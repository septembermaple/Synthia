name = "synthia-api"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "synthia-db"
database_id = "551bbb9a-c286-4c9a-b822-3f45fc86a372"

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://synthia-bk4.pages.dev"
ADMIN_PHONES = ""

[observability]
enabled = true

# 每小时清理一次过期 generations 与陈旧限流记录
[triggers]
crons = ["0 * * * *"]
