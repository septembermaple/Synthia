<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>API测试</h1>
        
        <div class="form-group">
            <label for="apiKey">API密钥:</label>
            <input type="text" id="apiKey" value="0c840957-7b90-43f4-980e-91d0272e861c">
        </div>
        
        <div class="form-group">
            <label for="prompt">提示词:</label>
            <textarea id="prompt" rows="4">测试图片生成</textarea>
        </div>
        
        <button onclick="testAPI()">测试API</button>
        
        <div class="result" id="result">
            点击测试按钮开始测试...
        </div>
    </div>
    
    <script>
        async function testAPI() {
            const apiKey = document.getElementById('apiKey').value;
            const prompt = document.getElementById('prompt').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = '测试中...';
            
            try {
                // 测试聊天API
                const chatResponse = await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'doubao-1.5-pro-256k',
                        messages: [
                            {
                                role: 'user',
                                content: '你好，测试API连接'
                            }
                        ],
                        max_tokens: 100,
                        temperature: 0.7
                    })
                });
                
                const chatData = await chatResponse.json();
                
                resultDiv.innerHTML = `
                    <h3>聊天API测试结果:</h3>
                    <pre>${JSON.stringify(chatData, null, 2)}</pre>
                `;
                
                if (chatResponse.ok) {
                    resultDiv.classList.add('success');
                } else {
                    resultDiv.classList.add('error');
                }
                
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3 class="error">测试失败:</h3>
                    <pre>${error.message}</pre>
                `;
            }
        }
    </script>
</body>
</html>
